<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card makker</title>
    <style>
        *{
            margin: 0;
            padding:2;
        }
        body{
            background-color: grey;
            padding: 45px;
        }
        .card{
background-color: white;
width: 200px;
border-radius: 7px;
padding: 0 0 34px 0;
        }
        .image{
            padding: 5px;

        }
        .image img{
            border-radius: 7px;
        }
.content h2{
 
}
        .content{
            padding: 7px 13px;
        }
        .content p{
            font-size: 13px;
            color: gray;
        }
        .capsules{
            padding: 0 28px 0 14px;
        }
        .capsules span{
            border: 1px solid gray;
            border-radius: 7px;
            padding: 0px 6px;
            font-size: 12px;
        }
        .button{
            text-align: center;
        }
        .button button{
           
            border: 1px ;
            border-radius: 10px;
            padding: 5px ;
        font-weight: bold;
            background-color: rgb(213, 213, 240);
            color: rgb(5, 63, 251);
            cursor: pointer;
            
        }
.button button:hover{
    background-color: rgb(156, 200, 244);
    color: rgb(18, 138, 198);
}
    </style>
</head>
<body>
    <div class="card">
        <div class="image">
            <img width="188" src="https://images.pexels.com/photos/3880179/pexels-photo-3880179.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="">
        </div>
        <div class="capsules">
            <span>Nature</span>
            <span>Lakes</span>
        </div>
        <div class="content">
            <h2>Karan </h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quia, dolorem. Sequi commodi possimus asperiores voluptatibus amet dolor, soluta similique, totam, odit quaerat necessitatibus.</p>
        </div>
        <div class="button">
            <button>Read More</button>
        </div>

    </div>
</body>
</html>
