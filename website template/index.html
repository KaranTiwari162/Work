<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> WEBSITE</title>
    <style>
       
        :root {
           --text--color: white;
            --secondary--color: rgb(167, 202, 235);
            --primary--color: rgb(6, 77, 242);
        } 
        

       

        * {
            margin: 0;
            padding: 0;


        }
        header {
            position: sticky;
            top: 0;
        }

        nav {
            background-color: var(--primary--color);
            padding: 23px 0;
        

        }

        ul li {
            list-style: none;
            color: var(--text--color);
            font-weight: bolder;
            padding: 23px;
            display: inline;


        }
     
        ul li a {
            text-decoration: none;
            color: var(--text--color);
        }

        main {
            background-color: rgb(161, 166, 231);
            color: rgb(255, 255, 255);
            padding: 34px;
        }

        .container {
            background-color: rgb(246, 238, 8);
            margin: 12px 34px;
            padding: 55px 23px;
            text-align: center;
        }

        .box1 {
            background-color: rgb(235, 79, 7);
            height: 70vh;
            width: 45%;
            display: inline-block;
            margin: 0 12px;
        }

        .box2 {
            background-color: rgb(28, 225, 6);
            height: 70vh;
            width: 45%;
            display: inline-block;
            margin: 0 12px;
        }





        .text-box-shadow {
            text-shadow: 10px 5px 3px #4d4b4db8;
            border: 2px solid rgb(110, 110, 112);
            border-radius: 80px;
            text-align: center;
            margin: 50px;
            padding: 100px;
            font-weight: bold;
            font-size: 50px;
            background-color: black;

        }
        
        .symbol-box {
            height: 32px;
            width: 32px;
            background: rgb(255, 0, 0);
            position: fixed;
            bottom: 12px;
            right: 23px;
            border-radius: 60px;
        }
        
        footer {
            background-color: rgb(11, 230, 246);
            font-weight:bold ;
            color: darkred;
            text-align: center;


        }
       
       
    </style>
</head>

<body>
    <header>

        <ul>
            <nav>

                <li><a href="/">HOME</a></li>
                <li><a href="/">ABOUT</a></li>
                <li><a href="/">SERVICES</a></li>
                <li><a href="/">CONTACTS</a></li>

            </nav>
        </ul>
    </header>

<main>
    <div class="container">
        <div class=" box1"></div>
        <div class="  box2"></div>
    </div>

    <div class="text-box-shadow">
        <p>
            Welcome to this Sigma Web Devlopment
        </p>
    </div>
    <div class="symbol-box"></div>
</main>
    <footer>
        <div class="footer">Copyright &copy;&nbsp; Reserved By Karan Tiwari</div>
    </footer>
</body>

</html>
